[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "encryption-claim-audit"
version = "0.1.0"
description = "Offline audit of documented at-rest protection promises against Python source."
requires-python = ">=3.9"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.scripts]
encryption-claim-audit = "encryption_claim_audit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
